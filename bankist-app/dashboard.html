<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="shortcut icon" type="image/png" href="./images/icon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css?family=Poppins:400,500,600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style-new.css" />
    <!-- <link rel="stylesheet" href="./css/style.css" /> -->
    <title>Bankist</title>
  </head>
  <body>
    <!-- My New Templ -->
    <nav class="navbar bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="#">
          <img src="./images/logo.png" alt="Logo" class="logo" />
          Bankist App

          <div class="logout hidden">
            <button type="submit">Logout</button>
          </div>
        </a>
      </div>
    </nav>
    <!-- TOP NAVIGATION -->
    <!-- <nav>
      <form class="login">
        <input
          type="text"
          placeholder="user"
          class="login__input login__input--user"
        />
        <input
          type="text"
          placeholder="PIN"
          maxlength="4"
          class="login__input login__input--pin"
        />
        <button class="login__btn">&rarr;</button>
      </form>
    </nav> -->

    <main class="app">
      <div class="container">
        <div class="spinner hidden">Loading...</div>

        <!-- BALANCE -->
        <div class="balance">
          <div>
            <p class="balance__label">Current balance</p>
            <p class="balance__date">
              As of <span class="date">05/03/2037</span>
            </p>
          </div>
          <p class="balance__value">0000 USD</p>
        </div>

        <div class="row align-items-start">
          <div class="col-md-7">
            <!-- MOVEMENTS -->
            <div class="movements">
              <div class="movements__row">
                <div class="movements__type movements__type--deposit">
                  2 deposit
                </div>
                <div class="movements__date">3 days ago</div>
                <div class="movements__value">4 000€</div>
              </div>
              <div class="movements__row">
                <div class="movements__type movements__type--withdrawal">
                  1 withdrawal
                </div>
                <div class="movements__date">24/01/2037</div>
                <div class="movements__value">-378€</div>
              </div>
            </div>
          </div>
          <div class="col-md-5">
            <!-- OPERATION: TRANSFERS -->

            <div class="operation operation--transfer">
              <h2>Transfer money</h2>
              <form class="form form--transfer">
                <div class="row g-2">
                  <div class="col-sm-6">
                    <input
                      type="text"
                      class="form-control form__input--to"
                      aria-label="First name"
                    />
                    <label class="form__label">Transfer to</label>
                  </div>
                  <div class="col-sm-5">
                    <input
                      type="text"
                      class="form-control form__input--amount"
                      aria-label="Last name"
                    />
                    <label class="form__label">Amount</label>
                  </div>
                  <div class="col-sm-1">
                    <button class="form__btn form__btn--transfer">
                      &rarr;
                    </button>
                  </div>
                </div>
              </form>

              <!-- <form class="form form--transfer">
                <input type="text" class="form__input form__input--to" />
                <input type="number" class="form__input form__input--amount" />
              </form> -->
            </div>

            <!-- OPERATION: LOAN -->
            <div class="operation operation--loan">
              <h2>Request loan</h2>
              <form class="form form--loan">
                <div class="row g-2">
                  <div class="col-sm-8">
                    <input
                      type="number"
                      class="form-control form__input--loan-amount"
                    />
                    <label class="form__label form__label--loan">Amount</label>
                  </div>
                  <div class="col-sm-1">
                    <button class="form__btn form__btn--loan">&rarr;</button>
                  </div>
                </div>
              </form>
            </div>

            <!-- OPERATION: CLOSE -->
            <div class="operation operation--close">
              <h2>Close account</h2>
              <form class="form form--close">
                <div class="row g-2">
                  <div class="col-sm-6">
                    <input type="text" class="form-control form__input--user" />
                    <label class="form__label">Confirm user</label>
                  </div>
                  <div class="col-sm-5">
                    <input
                      type="password"
                      maxlength="6"
                      class="form-control form__input--pin"
                    />
                    <label class="form__label">Confirm PIN</label>
                  </div>
                  <div class="col-sm-1">
                    <button class="form__btn form__btn--close">&rarr;</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- SUMMARY -->
        <div class="summary">
          <p class="summary__label">In</p>
          <p class="summary__value summary__value--in">0000 USD</p>
          <p class="summary__label">Out</p>
          <p class="summary__value summary__value--out">0000 USD</p>
          <p class="summary__label">Interest</p>
          <p class="summary__value summary__value--interest">0000 USD</p>
          <button class="btn--sort">&downarrow; SORT</button>
        </div>

        <!-- LOGOUT TIMER -->
        <p class="logout-timer">
          You will be logged out in <span class="timer">05:00</span>
        </p>
      </div>
    </main>

    <div class="modal hidden">
      <button class="close-modal">&times;</button>
      <h2 class="error">I'm a modal window 😍</h2>
    </div>
    <div class="overlay hidden"></div>

    <script type="module" src="./js/main.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
