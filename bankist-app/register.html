<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="shortcut icon" type="image/png" href="./images/icon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css?family=Poppins:400,500,600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style-new.css" />
    <!-- <link rel="stylesheet" href="./css/style.css" /> -->
    <title>Bankist</title>
  </head>
  <body>
    <!-- TOP NAVIGATION -->
    <nav class="navbar bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="#">
          <img src="./images/logo.png" alt="Logo" class="logo" />
          Bankist App

          <div class="logout hidden">
            <button type="submit">Logout</button>
          </div>
        </a>
      </div>
    </nav>
    <div class="register">
      <p class="notic">If you don't have an account, register first.</p>
      <h2 class="register-title">Register Form</h2>
      <form class="register_form" id="register__form" name="">
        <div>
          <input
            type="text"
            id="register__firstname"
            placeholder="First Name"
            class="login__input half"
          />
          <small data-error="firstName"></small>
          <input
            type="text"
            id="register__lastname"
            placeholder="Last Name"
            class="login__input half"
          />
          <small data-error="lastName"></small>
        </div>

        <input
          type="password"
          id="register__password"
          placeholder="Enter Password"
          class="login__input"
        />
        <small data-error="password"></small>

        <input
          type="password"
          id="register__confirm_password"
          placeholder="Enter Confirm Password"
          class="login__input"
        />
        <small data-error="confirmPass"></small>

        <input
          type="number"
          id="register__balance"
          placeholder="Initial Balance"
          class="login__input"
        />
        <small data-error="balance"></small>

        <label>Interest Rate: </label>
        <select
          name="interest-rate"
          id="register__input_rate"
          class="login__input"
        >
          <option value="1.2">1.2</option>
          <option value="1.3">1.3</option>
          <option value="1.5">1.5</option>
        </select>
        <small data-error="rate"></small>

        <button class="register__btn" style="width: 30rem; margin-top: 5px">
          Register
        </button>
      </form>
    </div>
  </body>
</html>
