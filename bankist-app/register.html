<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="shortcut icon" type="image/png" href="./images/icon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css?family=Poppins:400,500,600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style-new.css" />
    <!-- <link rel="stylesheet" href="./css/style.css" /> -->
    <title>Bankist</title>
  </head>
  <body>
    <!-- TOP NAVIGATION -->
    <nav class="navbar bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img src="./images/logo.png" alt="Logo" class="logo" />
          Bankist App

          <div class="logout hidden">
            <button type="submit">Logout</button>
          </div>
        </a>
        <div class="">
          Already have an account? &nbsp;&nbsp;&nbsp;
          <a href="index.html" class="alert-link"> Login </a>
        </div>
      </div>
    </nav>

    <div class="overlay hidden">Creating account ...</div>

    <div class="form-container">
      <div class="alert alert-success register_success hidden" role="alert">
        Congratulations! Account created successfully.
      </div>
      <form class="register_form">
        <h2>Register Form</h2>
        <br />
        <div class="row mb-3">
          <div class="col">
            <div class="form-floating">
              <input
                type="text"
                class="form-control register__firstname"
                placeholder="First Name"
              />
              <label for="firstName">First Name</label>
              <small data-error="firstName"></small>
            </div>
          </div>
          <div class="col">
            <div class="form-floating">
              <input
                type="text"
                class="form-control register__lastname"
                placeholder="Last Name"
              />
              <label for="lastName">Last Name</label>
              <small data-error="lastName"></small>
            </div>
          </div>
        </div>

        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control register__password"
            placeholder="Password"
          />
          <label for="password">Password</label>
          <small data-error="password"></small>
        </div>

        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control register__confirm_password"
            placeholder="Confirm Password"
          />
          <label for="confirmPass">Confirm Password</label>
          <small data-error="confirmPass"></small>
        </div>

        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control register__balance"
            placeholder="Initial Balance"
          />
          <label for="balance">Initial Balance</label>
          <small data-error="balance"></small>
        </div>

        <div class="form-floating mb-3">
          <label for="rate">Interest Rate: </label>
          <select name="interest-rate" class="form-select register__input_rate">
            <option value="1.2">1.2</option>
            <option value="1.3">1.3</option>
            <option value="1.5">1.5</option>
          </select>
          <small data-error="rate"></small>
        </div>
        <div class="d-grid gap-2 col-6">
          <button class="btn btn-primary register__btn">Register</button>
        </div>
      </form>
      <div class="alert alert-light" role="alert">
        Already have an account?
        <a href="index.html" class="alert-link"> Login </a>
      </div>
    </div>

    <script type="module" src="./js/registerMain.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
