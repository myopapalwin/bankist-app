<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="shortcut icon" type="image/png" href="./images/icon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css?family=Poppins:400,500,600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style-new.css" />
    <title>Bankist</title>
  </head>
  <body>
    <!-- TOP NAVIGATION -->
    <nav class="navbar bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="#">
          <img src="./images/logo.png" alt="Logo" class="logo" />
          Bankist App
        </a>
      </div>
    </nav>

    <div class="form-container">
      <form class="login-form">
        <h2>Log in to get started</h2>
        <br />
        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control login__input--user"
            id="username"
            placeholder="User name"
          />
          <label for="floatingInput">User name</label>
          <small data-error="username"></small>
        </div>
        <div class="form-floating">
          <input
            type="password"
            class="form-control login__input--pin"
            id="password"
            placeholder="Password"
          />
          <label for="floatingPassword">Password</label>
          <small data-error="password"></small>
        </div>
        <div class="d-grid gap-2 col-6">
          <button class="btn btn-primary login__btn">Login</button>
        </div>
      </form>
      <div class="alert alert-light" role="alert">
        You haven't account yet?
        <a href="register.html" class="alert-link"> Register Now</a>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
